<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ScrumLaunch theme</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>teams.scrumlaunch.com</h1>
  </header>
  <div class="modes" role="radiogroup" aria-label="Theme mode">
    <button type="button" data-mode="dark"   role="radio" aria-checked="false">
      <span class="icon">●</span><span class="label">Dark</span><span class="hint">Dark Modern palette</span>
    </button>
    <button type="button" data-mode="light"  role="radio" aria-checked="false">
      <span class="icon">○</span><span class="label">Light</span><span class="hint">Original site, untouched</span>
    </button>
    <button type="button" data-mode="system" role="radio" aria-checked="false">
      <span class="icon">◐</span><span class="label">System</span><span class="hint">Follow OS preference</span>
    </button>
  </div>
  <script src="../lib/theme-logic.js"></script>
  <script src="popup.js"></script>
</body>
</html>
